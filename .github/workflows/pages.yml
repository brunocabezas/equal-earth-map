name: Deploy pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the commit this deploy is built from
        run: |
          cat > version.js << EOF
          window.EQUAL_EARTH_VERSION = {
            commit: "${GITHUB_SHA}",
            short: "$(echo "${GITHUB_SHA}" | cut -c1-7)",
            builtAt: "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          };
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
