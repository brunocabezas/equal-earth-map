name: Deploy pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.45"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Stamp the commit this deploy is built from
        run: |
          cat > version.js << EOF
          window.EQUAL_EARTH_VERSION = {
            commit: "${GITHUB_SHA}",
            short: "$(echo "${GITHUB_SHA}" | cut -c1-7)",
            builtAt: "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          };
          EOF
      - name: Stage the static site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude .git \
            --exclude .github \
            --exclude .cursor \
            --exclude .impeccable \
            --exclude node_modules \
            --exclude src \
            --exclude _site \
            --exclude tsconfig.json \
            --exclude package.json \
            --exclude bun.lockb \
            --exclude '*.md' \
            ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
